<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">Structured view-model coverage of critical consequence facts</title>
<desc id="desc">For three project-defined critical categories in 32 post-action scenarios, compare exact structured fact matches in the target-local baseline and AuthorityLens view models. It is not rendered content or human comprehension.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b3a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#5a6c78}.box-title{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#5a6c78}.label{font-size:13px;font-weight:700;letter-spacing:1px}</style>
<rect width="1100" height="630" fill="#ffffff"/>
<text x="52" y="54" class="title">Structured representation coverage</text>
<text x="52" y="84" class="subtitle">Critical consequence fact categories · 32 eligible post-action scenarios</text>
<line x1="150" y1="480" x2="970" y2="480" stroke="#d5dee4" stroke-width="2"/>
<text x="130" y="485" text-anchor="end" class="small">0%</text>
<line x1="150" y1="330" x2="970" y2="330" stroke="#d5dee4" stroke-width="2"/>
<text x="130" y="335" text-anchor="end" class="small">50%</text>
<line x1="150" y1="180" x2="970" y2="180" stroke="#d5dee4" stroke-width="2"/>
<text x="130" y="185" text-anchor="end" class="small">100%</text>
<rect x="165" y="125" width="18" height="18" fill="#24445d"/>
<text x="192" y="140" class="small">Conventional target-local view</text>
<rect x="450" y="125" width="18" height="18" fill="#c07a27"/>
<text x="477" y="140" class="small">AuthorityLens view</text>
<line x1="184.66666666666663" y1="480" x2="276.66666666666663" y2="480" stroke="#24445d" stroke-width="4"/>
<text x="230.66666666666663" y="464" text-anchor="middle" class="small">0/39</text>
<rect x="296.667" y="180" width="92" height="300" rx="5" fill="#c07a27"/>
<text x="342.66666666666663" y="164" text-anchor="middle" class="small">39/39</text>
<text x="286.667" y="520" text-anchor="middle" class="body">Residual authority</text>
<line x1="458.0" y1="480" x2="550.0" y2="480" stroke="#24445d" stroke-width="4"/>
<text x="504.0" y="464" text-anchor="middle" class="small">0/4</text>
<rect x="570" y="180" width="92" height="300" rx="5" fill="#c07a27"/>
<text x="616.0" y="164" text-anchor="middle" class="small">4/4</text>
<text x="560" y="520" text-anchor="middle" class="body">Pending effects</text>
<line x1="731.3333333333333" y1="480" x2="823.3333333333333" y2="480" stroke="#24445d" stroke-width="4"/>
<text x="777.3333333333333" y="464" text-anchor="middle" class="small">0/6</text>
<rect x="843.333" y="180" width="92" height="300" rx="5" fill="#c07a27"/>
<text x="889.3333333333333" y="164" text-anchor="middle" class="small">6/6</text>
<text x="833.333" y="520" text-anchor="middle" class="body">Unknown authority</text>
<text x="52" y="565" class="small">Exact structured fact matching under the project taxonomy. The local baseline is scoped to the controlled principal.</text>
<text x="52" y="590" class="small">Not rendered-page coverage, user comprehension, usability, safety, or an independent validation of model completeness.</text>
